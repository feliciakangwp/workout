<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1a46"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#ffffff">
    <!-- dumbbell: outer and inner plates, handle -->
    <rect x="70" y="176" width="44" height="160" rx="14"/>
    <rect x="118" y="146" width="56" height="220" rx="16"/>
    <rect x="338" y="146" width="56" height="220" rx="16"/>
    <rect x="398" y="176" width="44" height="160" rx="14"/>
  </g>
  <!-- heartbeat line as the handle -->
  <polyline points="174,256 206,256 226,208 254,312 280,224 298,256 338,256" fill="none" stroke="#7dd3fc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
